[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefkasten"
version = "0.1.0"
description = "Multi-agent assistant that explains official German mail, computes legal deadlines and drafts replies for human approval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arjit Yadav" }]
dependencies = [
  "pydantic>=2.6",
  "click>=8.1",
  "pypdf>=4.0",
  "certifi>=2024.2.2",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
scans = ["pypdfium2>=4.0"]
photos = ["pillow>=10.0", "pillow-heif>=0.16"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
briefkasten = "briefkasten.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefkasten = ["web/*.html", "web/dist/*.html", "web/dist/assets/*", "samples/letters/*.txt", "samples/gold/*.json", "samples/replays/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
